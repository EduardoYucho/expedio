spring:
  application:
    name: plumb
  config:
    # módulos (atendimentos e base de conhecimento; monitor fiscal; backups de clientes): configuração em arquivo próprio
    import:
      - optional:classpath:atendimento.yml
      - optional:classpath:fiscal.yml
      - optional:classpath:backup-clientes.yml
      - optional:classpath:clientes.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plumb}
    username: ${DB_USER:plumb}
    password: ${DB_PASSWORD:plumb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade exclusiva do Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # as tarefas agendadas (pings do tempo real, avisos, vetores da base, limpezas) não esperam umas pelas outras
        size: 4
  servlet:
    multipart:
      max-file-size: 10MB        # por arquivo: relatório do RH (conciliação) e comprovantes enviados pela tela
      max-request-size: 40MB     # vários comprovantes numa mesma requisição

server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: -1         # envio grande demais recebe a resposta 413 em vez de a conexão cair

plumb:
  fuso-horario: America/Sao_Paulo
  tolerancia-minutos: 5
  grade:
    entrada1: "08:00"
    saida1: "12:00"
    entrada2: "13:00"
    saida2: "17:48"
  cors-origens-permitidas:
    - http://localhost:5173

  # Banco de horas semestral: o saldo do painel é o do ciclo aberto. O botão "Fechar banco de horas"
  # congela o saldo e recomeça do zero. Avisos 30 e 15 dias antes da previsão de fechamento.
  banco-horas:
    inicio-primeiro-ciclo: 2026-05-25   # usado só na primeira subida; depois, corrija pela tela
    duracao-meses: 6
    cron-alertas: "0 0 1 * * *"         # conferência diária dos prazos (01:00)

  # Importação automática dos comprovantes (PDF) baixados do Ponto Fácil
  importacao-pdf:
    habilitado: ${PLUMB_PDF_HABILITADO:true}
    # Cada usuário escolhe a própria pasta em "Minha conta" (local ou de rede, ex.: //192.168.0.10/Ponto).
    # Este valor só é usado uma vez: na atualização para vários usuários, se ninguém tiver pasta, ela passa
    # a ser a pasta do primeiro administrador.
    diretorio: ${PLUMB_PDF_DIR:}
    processar-existentes: true      # ao iniciar, importa PDFs que já estavam na pasta (sem duplicar)
    varredura-periodica: 30s        # confere a pasta mesmo sem aviso do Windows (pasta de rede); 0 desliga
    intervalo-reconexao: 15s        # pasta inacessível (VPN caiu, outro PC desligado): tenta de novo
    estabilizacao: 300ms            # confirma que o download terminou (tamanho estável)
    tentativas-leitura: 20
    intervalo-tentativa: 500ms
    tamanho-maximo: 10MB
    # regex: precisa dos grupos (?<data>dd/MM/yyyy) e (?<hora>HH:mm[:ss]); o padrão cobre
    #        "Comprovante de Ponto - dd/MM/yyyy HH:mm:ss"

  # Arquivo dos PDFs de comprovante (fora do banco): <diretorio>/<ano>/<mês>/comprovante_<uuid>.pdf
  armazenamento:
    diretorio: ${PLUMB_ARMAZENAMENTO_DIR:${user.home}/.plumb/comprovantes}
    url-base: /api/comprovantes

  # Backup automático (no Windows, pelo comando "plumb"): todo dia, depois do horário, se ainda não houver um
  # backup do dia na pasta (o do "plumb atualizar" conta), a aplicação roda "plumb backup diario". Se falhar,
  # tenta de novo a cada hora e avisa no sino de quem vê os logs. A guarda e a cópia fora do PC são do comando
  # (README, seção Backup).
  backup:
    automatico: true
    horario: "12:15"
    pasta: ${PLUMB_BACKUP_DIR:${user.home}/.plumb/backups}
    script: ${user.home}/.plumb/servico/bin/plumb.ps1
    verificacao: 15m
    # Cópia fora do PC (outro disco ou pen drive), lida pelo comando "plumb": vazio = desligada.
    # Ex.: "E:/Backups" (os backups vão para E:/Backups/Plumb/backups e os PDFs para .../comprovantes)
    copia:
      pasta: ${PLUMB_BACKUP_COPIA:}

  # Planilha de conferência no Google Sheets (opcional). O administrador envia pela tela (Usuários) a chave de
  # uma conta de serviço do Google Cloud; cada pessoa compartilha a planilha dela com o e-mail dessa conta e
  # cola o link em "Minha conta". A chave fica neste arquivo, fora do banco de dados.
  google:
    credencial: ${PLUMB_GOOGLE_CREDENCIAL:}   # vazio = ~/.plumb/google/conta-de-servico.json
    espera: 4s                                # junta mudanças seguidas (vários PDFs) numa gravação só

  # Logs: além do log geral (logging.file.name), cada linha vai para um arquivo por usuário e por hora em
  # <diretorio>/usuarios/<login>/<aaaa-mm-dd>/<hh>h.log ("sistema" = o que não é de uma pessoa).
  logs:
    diretorio: ${PLUMB_LOGS_DIR:${user.home}/.plumb/logs}
    dias: 30                        # os arquivos por usuário mais antigos são apagados

  seguranca:
    jwt:
      segredo: ${PLUMB_JWT_SEGREDO:}   # >= 32 caracteres; vazio = chave aleatória a cada subida
      expiracao: 8h
      emissor: plumb
    # Criados na primeira subida, se não existirem. Senha vazia = gerada e exibida uma vez no log.
    # Para usar outros logins/nomes, redefina a lista inteira em config/application.yml.
    # perfis: os do sistema (ROLE_ADMIN = Administrador, ROLE_USER = Usuário, ROLE_VIEWER = Coordenador);
    # depois, os perfis de cada pessoa mudam na tela Usuários.
    usuarios-iniciais:
      - login: admin
        nome: Administrador
        senha: ${PLUMB_ADMIN_SENHA:}
        perfis: [ROLE_ADMIN]
      - login: coordenacao
        nome: Coordenação
        senha: ${PLUMB_VIEWER_SENHA:}
        perfis: [ROLE_VIEWER]

logging:
  pattern:
    correlation: "[%X{usuario:-sistema}|%X{protocolo:--}] "   # de quem é a linha e o protocolo da requisição
  level:
    br.com.plumb.infrastructure.importacao: INFO
    # As fontes dos PDFs (comprovantes, conversas do Digisac) geram centenas de avisos por semana que não mudam a
    # leitura ("No Unicode mapping...", "Using fallback font..."): só os erros delas vão para o log.
    org.apache.pdfbox.pdmodel.font: ERROR
    org.apache.fontbox: ERROR
