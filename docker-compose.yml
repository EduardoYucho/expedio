services:
  postgres:
    image: postgres:16-alpine
    container_name: plumb-db
    environment:
      POSTGRES_DB: plumb
      POSTGRES_USER: plumb
      POSTGRES_PASSWORD: plumb
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumb -d plumb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
